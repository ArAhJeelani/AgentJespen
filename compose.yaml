services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: agentjepsen
      POSTGRES_PASSWORD: agentjepsen
      POSTGRES_DB: agentjepsen
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentjepsen -d agentjepsen"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://agentjepsen:agentjepsen@db/agentjepsen
      TEST_DATABASE_URL: postgresql+psycopg://agentjepsen:agentjepsen@db/agentjepsen_test
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0"]
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  payment-data:
